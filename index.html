<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<style>html{background:#0b0b0d}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>TOPLEAKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Mise en page : une colonne mobile, trois écrans (accueil, détail, paiement), ambiance salle de cinéma, sombre uniquement */
:root{
  --bg:#0b0b0d; --outer:#050506; --surface:#151518; --raise:#1e1e23; --line:#2a2a31;
  --fg:#f2f0eb; --soft:#d4d1d9; --muted:#a09da8;
  --accent:#ffb21e; --accent-ink:#1a1100; --ok:#3ddc97; --bad:#ff7a6e;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
@media (min-width:560px){body{background:var(--outer)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.app{
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  max-width:520px;margin:0 auto;background:var(--bg);
  padding-left:var(--gl);padding-right:var(--gr);
}
@media (min-width:560px){.app{border-inline:1px solid var(--line)}}

.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border:0;border-radius:12px;font-weight:700;font-size:16px;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;cursor:default}

/* En-tête */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));
  padding:10px var(--gr) 10px var(--gl);
  display:flex;align-items:center;gap:12px;background:var(--bg);
}
.logo{font:800 21px/1 var(--display);letter-spacing:.02em}
.logo span{color:var(--accent)}
.logo-mark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo-mark .ic{width:20px;height:20px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 38px 0 40px;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline-offset:0}
.search .lead{position:absolute;left:13px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:4px;top:50%;translate:0 -50%;width:32px;height:32px;border:0;background:none;border-radius:50%;color:var(--muted);display:grid;place-items:center}

/* Bannière */
.hero{margin-top:6px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;background:var(--g);overflow:hidden;min-width:0}
.glyph{position:absolute;font:800 170px/1 var(--display);color:rgba(255,255,255,.14);right:6%;top:2%;user-select:none}
.slide::before,.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 0%,rgba(255,255,255,.26),transparent 70%)}
.scrim{position:absolute;inset:auto 0 0;height:70%;background:linear-gradient(to top,rgba(11,11,13,.96) 12%,rgba(11,11,13,0))}
.slide-body{position:absolute;inset:auto 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:700;letter-spacing:.04em}
.tag-vip{background:var(--accent);color:var(--accent-ink)}
.slide-title{font:800 30px/1.05 var(--display);text-wrap:balance}
.slide-meta{color:var(--soft);font-size:14px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.dots i.on{width:20px;border-radius:3px;background:var(--accent)}

/* Rangées */
.row{margin-top:26px}
.row h2{font:800 19px/1.2 var(--display);margin-bottom:12px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding:0 var(--gr) 4px var(--gl);scroll-padding-left:var(--gl)}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 168px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;background:none;border:0;padding:0}
.thumb{position:relative;aspect-ratio:16/10;border-radius:10px;background:var(--g);overflow:hidden}
.thumb .glyph{font-size:84px;right:4%;top:-2%}
.dur{position:absolute;right:6px;bottom:6px;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.75);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.vip{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;letter-spacing:.06em}
.vip .ic{width:11px;height:11px;stroke-width:2.6}
.c-title{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{font-size:12px;color:var(--muted)}
.res-count{margin:14px 0 14px;color:var(--muted);font-size:14px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{margin:34px 0 28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Détail et lecteur */
.player{position:relative;margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));aspect-ratio:16/9;background:var(--g);overflow:hidden}
.player::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 0%,rgba(255,255,255,.22),transparent 70%)}
.player .glyph{font-size:200px;right:5%;top:-8%}
.p-back{position:absolute;top:12px;left:var(--gl);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:2}
.p-chip{position:absolute;top:18px;right:var(--gr);display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);font-size:12px;font-weight:700;z-index:2}
.p-chip .ic{width:13px;height:13px}
.p-play{position:absolute;left:50%;top:50%;translate:-50% -60%;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:2}
.p-play .ic{width:28px;height:28px}
.p-play.on{opacity:.55}
.p-ctl{position:absolute;inset:auto 0 0;padding:26px var(--gr) 8px var(--gl);background:linear-gradient(to top,rgba(0,0,0,.7),transparent);z-index:2}
.p-time{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;color:var(--soft)}
.gate{position:absolute;inset:0;z-index:3;background:rgba(11,11,13,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.gate p{font-weight:700;text-wrap:balance}
.gate .btn{width:auto;min-height:44px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.3) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--accent);border:0}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:0}

.meta{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.d-title{font:800 28px/1.08 var(--display);text-wrap:balance}
.rating{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stars{position:relative;display:inline-block;font-size:19px;line-height:1;letter-spacing:2px}
.stars-base{color:#3a3a42}
.stars-fill{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--accent)}
.score{padding:3px 9px;border-radius:6px;background:var(--raise);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.score small{font-weight:500;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--soft);font-size:13px}
.chip.vipc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.cta{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.cta .btn{min-height:56px;font-size:17px}
.cta small{color:var(--muted);font-size:13px}
.ok-note{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;font-size:14px}
.desc{color:var(--soft);max-width:65ch}
.artist{display:flex;gap:14px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.avatar{flex:none;width:54px;height:54px;border-radius:50%;background:var(--g);display:grid;place-items:center;font:800 18px var(--display)}
.artist h3{font:800 17px/1.2 var(--display)}
.artist .role{color:var(--accent);font-size:13px;font-weight:700;margin-bottom:4px}
.artist .bio{color:var(--soft);font-size:14px}
.artist .count{margin-top:6px;color:var(--muted);font-size:13px}
.actions{position:sticky;bottom:0;margin:22px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:12px var(--gr) 14px var(--gl);display:flex;gap:10px;background:var(--bg);border-top:1px solid var(--line)}
.actions .btn{min-height:46px;font-size:15px}
.fav[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.fav[aria-pressed=true] .ic{fill:var(--accent)}

/* Paiement */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding:10px var(--gr) 10px var(--gl);display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;background:var(--bg)}
.pbar .x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.pbar h2{font:800 18px var(--display);text-align:center}
.secure{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:12px;font-weight:700}
.secure .ic{width:15px;height:15px}
.sum{margin-top:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.sum-top{display:flex;gap:12px;align-items:center}
.sum-top .thumb{flex:0 0 104px}
.sum-top b{display:block;font-size:15px;line-height:1.3}
.sum-top span{color:var(--muted);font-size:13px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--soft);font-size:14px}
.sum-row.total{font-weight:700;color:var(--fg)}
.amount{font:800 30px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.label{display:block;margin:24px 0 10px;font-weight:700;font-size:14px;letter-spacing:.02em}
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;padding:0;margin:0}
.op{position:relative;display:block}
.op input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.op span{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:8px 4px;border-radius:12px;background:var(--c);color:var(--t);font-weight:800;font-size:14px;text-align:center;line-height:1.15}
.op .oplogo{max-width:84%;max-height:40px;object-fit:contain}
.op small{font-size:11px;font-weight:700;opacity:.85}
.op input:checked + span{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.op input:checked + span::after{content:"✓";position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:#fff;color:#111;font-size:12px;font-weight:800;display:grid;place-items:center}
.op input:focus-visible + span{outline:2px solid var(--fg);outline-offset:2px}
.field{width:100%;height:54px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.field::placeholder{color:#5f5d66}
.field.bad{border-color:var(--bad)}
.hint{margin-top:8px;color:var(--muted);font-size:13px}
.err{margin-top:8px;color:var(--bad);font-size:14px;font-weight:500;min-height:1.4em}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.proto{margin:20px 0 28px;text-align:center;color:var(--muted);font-size:12px}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:44px 0 10px}
.state h3{font:800 24px/1.15 var(--display);text-wrap:balance}
.state p{color:var(--soft);max-width:34ch}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:turn .9s linear infinite}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#06241a;display:grid;place-items:center}
.tick .ic{width:34px;height:34px;stroke-width:3}
.ref{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
@keyframes turn{to{rotate:360deg}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 20px;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--fg);color:#111;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,translate .2s;z-index:40}
.toast.show{opacity:1;translate:-50% 0}

/* Glassmorphism : panneaux translucides, flou d'arrière-plan, bords lumineux, lueurs colorées derrière le contenu */
:root{--glass:rgba(255,255,255,.07);--glass-line:rgba(255,255,255,.15);--glass-hi:inset 0 1px 0 rgba(255,255,255,.22);--blur:blur(16px) saturate(150%)}
.app{background-image:radial-gradient(420px 380px at 92% 3%,rgba(255,178,30,.24),transparent 70%),radial-gradient(460px 420px at -5% 18%,rgba(124,77,255,.28),transparent 70%),radial-gradient(480px 440px at 100% 46%,rgba(255,84,112,.18),transparent 70%),radial-gradient(520px 460px at 0% 76%,rgba(40,170,255,.18),transparent 70%);background-repeat:no-repeat}
.bar,.card,.slide-body,.p-back,.p-chip,.p-play,.gate,.score,.chip,.artist,.actions,.pbar,.toast,#payform,#paywait,#payok{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.bar,.pbar{background:rgba(11,11,13,.5);border-bottom:1px solid var(--glass-line)}
.search input{background:rgba(255,255,255,.08);border-color:var(--glass-line)}
.scrim{height:55%}
.slide-body{inset:auto 12px 12px;padding:16px;border-radius:18px;background:rgba(18,18,24,.42);border:1px solid rgba(255,255,255,.2);box-shadow:var(--glass-hi),0 14px 40px rgba(0,0,0,.45)}
.tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18)}
.tag-vip{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{padding:6px 6px 10px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi)}
.card .c-title,.card .c-meta{padding-inline:4px}
.thumb{border-radius:11px}
.rail .card{flex-basis:184px}
.rail{padding-top:2px}
.p-back,.p-chip,.p-play{border:1px solid rgba(255,255,255,.28);background:rgba(20,20,26,.35);box-shadow:var(--glass-hi)}
.gate{background:rgba(11,11,13,.45)}
.score,.chip{background:var(--glass);border:1px solid var(--glass-line)}
.chip.vipc{background:var(--accent);border-color:var(--accent)}
.artist{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 10px 30px rgba(0,0,0,.25)}
.actions{background:rgba(11,11,13,.5);border-top:1px solid var(--glass-line)}
.btn-ghost{background:rgba(255,255,255,.06);border-color:var(--glass-line)}
.pbar .x{background:rgba(255,255,255,.08);border:1px solid var(--glass-line)}
#payform,#paywait,#payok{margin-top:10px;padding:18px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);box-shadow:var(--glass-hi),0 24px 60px rgba(0,0,0,.5)}
#paywait,#payok{padding:36px 18px 24px}
.sum{background:rgba(255,255,255,.06);border-color:var(--glass-line);box-shadow:var(--glass-hi)}
.field{background:rgba(255,255,255,.07);border-color:var(--glass-line)}
.field.bad{border-color:var(--bad)}
.op span{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.35)}
.toast{background:rgba(32,32,40,.7);color:var(--fg);border:1px solid var(--glass-line)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .bar,.pbar,.actions{background:rgba(11,11,13,.94)}
  .slide-body{background:rgba(18,18,24,.88)}
  #payform,#paywait,#payok{background:#17171c}
  .card{background:var(--surface)}
  .toast{background:#26262e}
  .gate{background:rgba(11,11,13,.9)}
}

#vid{position:absolute;inset:0;width:100%;height:100%;z-index:1;background:#000;object-fit:contain}
/* Temps du lecteur (fichier player-time_Version2.css) */
.p-time{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
.p-time span{min-width:48px;padding:4px 9px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(15,15,20,.72);color:#f2f0eb;text-align:center;font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#seek{accent-color:#ffb21e}
/* Couverture figée et contact */
.cover-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;pointer-events:none;z-index:0}
.cover-video ~ .glyph{display:none}
.thumb::before,.slide::before,.scrim{z-index:1}
.slide-body,.thumb .vip,.thumb .dur{z-index:2}
.contact{margin-top:34px;padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.contact h2{font:800 19px/1.2 var(--display);margin-bottom:6px}
.contact p{color:var(--soft);font-size:14px}
.contact-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.clink{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--glass-line);background:rgba(255,255,255,.06);color:var(--fg);font-weight:700;text-decoration:none}
.clink.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clines{flex-basis:100%;margin-top:4px;color:var(--muted)!important;font-size:13px!important;user-select:text}
.cnumrow{display:flex;gap:8px;width:100%;margin-top:6px}
.cnum{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--glass-line);background:rgba(255,255,255,.07);color:var(--fg);font:700 18px var(--body);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.clabel{flex-basis:100%;margin-top:10px;color:var(--muted);font-size:13px}
button.clink{cursor:pointer;font:inherit;font-weight:700}

.kmenu button{min-height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--fg);text-align:left;font-size:14px;font-weight:500}
.kmenu button:hover,.kmenu button:focus-visible{background:rgba(255,255,255,.08)}
.kmenu button.danger{color:var(--bad)}
/* ===== V11 : compatibilité Safari mobile et anciens WebKit ===== */
/* inset, margin-inline et translate ne sont pas reconnus avant Safari 14.1 : équivalents en propriétés classiques */
body::before{top:0;left:0;right:0}
.scrim,.slide-body,.p-ctl{left:0;right:0;bottom:0}
.gate,.modal,.op input{top:0;left:0;right:0;bottom:0}
#vid,.cover-video{top:0;left:0}
.bar,.pbar,.player,.rail{margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr))}
.thumb,.slide,.player{-webkit-transform:translateZ(0);transform:translateZ(0)}
.thumb{width:100%;min-height:90px;isolation:isolate}
.cover-video{-webkit-transform:translateZ(0);transform:translateZ(0)}
.grid{grid-gap:22px}
@supports not (aspect-ratio:1/1){
  /* Sans aspect-ratio : hauteur obtenue par un remplissage proportionnel à la largeur */
  .thumb,.thumb-sk{height:0;min-height:0;padding-top:62.5%}
  .slide{height:0;padding-top:68.75%}
  .slide-sk{height:0;padding-top:125%}
  .player{height:0;padding-top:56.25%}
  .sum-top .thumb{height:65px;padding-top:0}
  /* Les anciens Safari ignorent display:flex sur un <button> : la carte devient un bloc */
  .card{display:block}
  .card .c-meta{display:block;margin-top:6px}
  .card .c-title{margin-top:6px}
}
@supports not (translate:0){
  .toast{-webkit-transform:translate(-50%,20px);transform:translate(-50%,20px)}
  .toast.show{-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
  .p-play{-webkit-transform:translate(-50%,-60%);transform:translate(-50%,-60%)}
  .search .lead,.search .clear{-webkit-transform:translateY(-50%);transform:translateY(-50%)}
  .spin{animation-name:turnT}
  .buffer{-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);animation-name:turnB}
  @keyframes turnT{to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}
  @keyframes turnB{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
}
</style>

  function uploadFile(file,fname,bucket){
    bucket=bucket||BUCKET;
    var name=Date.now()+'-'+(fname||file.name).normalize('NFD').replace(/[^\w.\-]+/g,'_');
    return authedFetch(SB_URL+'/storage/v1/object/'+enc(bucket)+'/'+enc(name),{method:'POST',headers:{'Content-Type':file.type||'video/mp4','x-upsert':'false'},body:file})
    .then(function(r){return r.ok?(bucket===BUCKET?SB_URL+'/storage/v1/object/public/'+enc(bucket)+'/'+enc(name):name):restErr(r)});
  }
  /* Couverture automatique : image figée de la vidéo choisie + durée, calculées dans le navigateur */
  function probeVideo(file){
    return new Promise(function(res){
      var v=document.createElement('video'),u=URL.createObjectURL(file),done=false;
      function fin(o){if(done)return;done=true;try{URL.revokeObjectURL(u)}catch(e){}res(o||{})}
      v.muted=true;v.playsInline=true;v.setAttribute('webkit-playsinline','');v.preload='metadata';v.onerror=function(){fin()};setTimeout(function(){fin()},12000);
      v.onloadedmetadata=function(){
        var d=isFinite(v.duration)?Math.round(v.duration):0;
        v.onseeked=function(){
          try{
            var w=Math.min(640,v.videoWidth||640),c=document.createElement('canvas');
            c.width=w;c.height=Math.round(w*(v.videoHeight||360)/(v.videoWidth||640));
            c.getContext('2d').drawImage(v,0,0,c.width,c.height);
            c.toBlob(function(b){fin({dur:d,blob:b})},'image/jpeg',.8);
          }catch(e){fin({dur:d})}
        };
        try{v.currentTime=Math.min(1,d/10)}catch(e){fin({dur:d})}
      };
      v.src=u;
    });
  }
  /* ---------- Envoi de plusieurs vidéos à la fois ----------
     Chaque fichier a son titre et son prix. Envoi un par un : analyse (couverture + durée), fichier,
     puis fiche dans la table. Un échec n'arrête pas les autres ; un nouveau clic ne renvoie que les échecs. */
  var multi=[];
  function baseTitle(n){return n.replace(/\.[^.]+$/,'').replace(/^\d{8,}-/,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim()}

  function resetMulti(){

      multi.map(function(m,i){return '<div class="mrow" data-i="'+i+'" data-state="wait"><input class="field mt" type="text" maxlength="120" aria-label="Titre" value="'+esc(m.title)+'"><input class="field mp" type="number" inputmode="numeric" min="0" step="100" aria-label="Prix en FC" value="'+esc(price)+'"><small>'+esc(m.file.name)+' · '+sizeMb(m.file)+'</small><span class="mst">En attente</span></div>'}).join('');

  function markRow(row,state,txt){row.setAttribute('data-state',state);row.querySelector('.mst').textContent=txt}
  function uploadOne(row){
    var m=multi[+row.getAttribute('data-i')],title=row.querySelector('.mt').value.trim(),price=parseInt(row.querySelector('.mp').value,10);
    if(title.length<2)return Promise.reject(new Error('Titre trop court'));

      return cleanFiles({video_path:up.video_path,video_url:up.video_url,thumbnail_url:up.thumbnail_url}).then(function(){throw err});
    });
  }
  function runBatch(){
    var rows=Array.prototype.slice.call(document.querySelectorAll('#amulti .mrow')).filter(function(r){return r.getAttribute('data-state')!=='ok'});

    }).catch(function(err){amsg('Échec : '+(err.noSession?t('admin_need'):err.message),true)}).then(function(){btn.disabled=false});
