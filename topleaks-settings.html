  <style>html,body{margin:0;width:100%;height:100%;background:#0b0b0d}body{overflow:hidden}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style>
</head>
<body>
<iframe id="app" title="TOPLEAKS" src="./topleaks%205.html"></iframe>
<script>
(function(){
  'use strict';
  var PROJECT='https://ozakwmoftlassrrcdiqg.supabase.co';
  var KEY='sb_publishable_yOJOb8ba26j8KsEbjQlUMA_ntB4GNo7';
  var frame=document.getElementById('app');
  var strings={
    'Rechercher':'Search','Effacer la recherche':'Clear search','Spectacles à la une':'Featured shows','Contactez-nous':'Contact us','Une question, un souci de paiement ou une proposition de spectacle ? Écrivez-nous.':'Questions, payment issues, or show proposals? Get in touch.','Tous':'All videos','Favoris':'Favorites','Dans mes favoris':'In favorites','Partager':'Share','Retour au catalogue':'Back to catalog','Aperçu de 30 s':'30-second preview','Position de lecture':'Playback position','Fin de l’aperçu. Débloquez ce spectacle pour voir la suite.':'Preview ended. Unlock this show to watch the rest.','DÉBLOQUER CE SPECTACLE':'UNLOCK THIS SHOW','Regarder maintenant':'Watch now','Spectacle débloqué':'Show unlocked','Gratuit':'Free','Paiement':'Payment','Sécurisé':'Secure','Choisissez votre opérateur':'Choose your payment provider','Numéro Mobile Money':'Mobile Money number','Le numéro du compte qui paie, 10 chiffres.':'The paying account number, 10 digits.','Confirmer le paiement':'Confirm payment','Annuler':'Cancel','Prototype de démonstration : aucun montant n’est débité.':'Demo only: no money will be charged.','Un souci de paiement ? Écrivez-nous sur WhatsApp':'Payment issue? Contact us on WhatsApp','Validez sur votre téléphone':'Approve on your phone','Fermer et revenir au spectacle':'Close and return to show','Paiement confirmé':'Payment confirmed','Aucune vidéo pour le moment.':'No videos yet.','Impossible de charger les vidéos.':'Could not load videos.','WhatsApp':'WhatsApp','Appeler':'Call','Écrire un e-mail':'Send an email','Notre numéro':'Our number','Copier':'Copy','Rechercher un nom d’artiste ou un titre.':'Search for an artist or title.','Rechercher':'Search','Chargement…':'Loading…','Connexion':'Sign in','Créer un compte':'Create account','Déconnexion':'Sign out','Adresse e-mail':'Email address','Mot de passe':'Password','Langue':'Language','Mode sombre':'Dark mode','Français':'French','Anglais':'English','Enregistrer':'Save','Paramètres':'Settings','Fermer':'Close','Connectez-vous ou créez un compte':'Sign in or create an account','Votre e-mail':'Your email','Votre mot de passe':'Your password','Connexion réussie.':'Signed in successfully.','Compte créé. Vérifiez votre e-mail si une confirmation est demandée.':'Account created. Check your email if confirmation is required.','Une erreur est survenue. Vérifiez votre e-mail et votre mot de passe.':'Something went wrong. Check your email and password.','Vous êtes connecté.':'You are signed in.','Vous n’êtes pas connecté.':'You are signed out.','Connexion Supabase impossible':'Could not connect to Supabase','Recommencer':'Try again'
  };
  var reverse={};Object.keys(strings).forEach(function(fr){reverse[strings[fr]]=fr});
  function dict(lang){return lang==='en'?strings:reverse}
  function init(){
    var doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!doc.body)return;
    var style=doc.createElement('style');style.textContent=''';
    style.textContent=""+
      ".bar{gap:8px!important}.search{min-width:80px!important}.tl-settings-button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line,rgba(255,255,255,.2));background:rgba(255,255,255,.08);color:var(--fg,#f2f0eb);font-size:20px;display:grid;place-items:center}.tl-settings-button:focus-visible{outline:2px solid currentColor;outline-offset:2px}"+
      ".tl-status-hidden{display:none!important}"+
      "#tl-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;font:15px/1.45 system-ui,-apple-system,sans-serif;color:#f2f0eb}#tl-backdrop.open{display:flex}"+
      ".tl-panel{width:min(100%,420px);max-height:min(90dvh,720px);overflow:auto;padding:20px;border:1px solid rgba(255,255,255,.18);border-radius:20px;background:#17171d;box-shadow:0 24px 80px rgba(0,0,0,.6)}"+
      ".tl-panel h2{margin:0 0 16px;font-size:22px}.tl-panel h3{margin:20px 0 10px;font-size:17px}.tl-close{float:right;width:36px;height:36px;border:1px solid #444;border-radius:50%;background:#24242b;color:#fff;font-size:20px}.tl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}.tl-row select,.tl-form input{min-height:42px;padding:8px 11px;border:1px solid #454550;border-radius:10px;background:#24242b;color:#fff}.tl-toggle{width:48px;height:28px;accent-color:#ffb21e}.tl-form{display:grid;gap:10px}.tl-form input{width:100%;font-size:16px}.tl-actions{display:flex;gap:9px}.tl-actions button,.tl-account-button{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:#ffb21e;color:#1a1100;font-weight:700}.tl-actions .secondary{background:#292930;border:1px solid #4a4a54;color:#fff}.tl-account-button{width:100%;margin-top:12px}.tl-message{min-height:1.4em;margin:10px 0;color:#ffcf74;font-size:13px}.tl-email{overflow-wrap:anywhere;color:#b8b5c0;font-size:13px}";
    doc.head.appendChild(style);
    var bar=doc.querySelector('.bar');if(!bar)return;
    var settingsButton=doc.createElement('button');settingsButton.type='button';settingsButton.className='tl-settings-button';settingsButton.textContent='⚙';settingsButton.setAttribute('aria-label','Paramètres');settingsButton.title='Paramètres';bar.appendChild(settingsButton);
    var backdrop=doc.createElement('div');backdrop.id='tl-backdrop';backdrop.innerHTML='<section class="tl-panel" role="dialog" aria-modal="true" aria-labelledby="tl-title"><button type="button" class="tl-close" aria-label="Fermer">×</button><h2 id="tl-title">Paramètres</h2><label class="tl-row"><span>Langue</span><select id="tl-language" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option></select></label><label class="tl-row"><span>Mode sombre</span><input id="tl-theme" class="tl-toggle" type="checkbox" role="switch"></label><h3 id="tl-auth-title">Connexion</h3><div id="tl-user" class="tl-email"></div><form id="tl-form" class="tl-form"><input id="tl-email" type="email" autocomplete="email" required placeholder="Adresse e-mail" aria-label="Adresse e-mail"><input id="tl-password" type="password" autocomplete="current-password" required minlength="6" placeholder="Mot de passe" aria-label="Mot de passe"><div class="tl-actions"><button id="tl-login" type="submit">Connexion</button><button id="tl-signup" class="secondary" type="button">Créer un compte</button></div></form><p id="tl-message" class="tl-message" role="status" aria-live="polite"></p><button id="tl-logout" class="tl-account-button" type="button" hidden>Déconnexion</button></section>';
    doc.body.appendChild(backdrop);
    var local=win.localStorage;
    var language=local.getItem('topleaks-language')||'fr';
    var dark=local.getItem('topleaks-theme')!=='light';
    var session;try{session=JSON.parse(local.getItem('topleaks-auth-session')||'null')}catch(e){session=null}
    var langControl=doc.getElementById('tl-language'),themeControl=doc.getElementById('tl-theme'),form=doc.getElementById('tl-form'),message=doc.getElementById('tl-message'),userLine=doc.getElementById('tl-user'),logout=doc.getElementById('tl-logout'),loginButton=doc.getElementById('tl-login'),signupButton=doc.getElementById('tl-signup');
    langControl.value=language;themeControl.checked=dark;
    function applyTheme(){var root=doc.documentElement;root.setAttribute('data-user-theme',dark?'dark':'light');if(dark){root.style.colorScheme='dark';doc.body.style.backgroundColor='#0b0b0d';doc.body.style.color='#f2f0eb'}else{root.style.colorScheme='light';root.style.setProperty('--bg','#f4f3f7');root.style.setProperty('--outer','#e9e8ed');root.style.setProperty('--surface','#fff');root.style.setProperty('--raise','#f0eff4');root.style.setProperty('--line','#d8d6df');root.style.setProperty('--fg','#17171c');root.style.setProperty('--soft','#46444d');root.style.setProperty('--muted','#6c6974');doc.body.style.backgroundColor='#f4f3f7';doc.body.style.color='#17171c'};local.setItem('topleaks-theme',dark?'dark':'light')}
    function applyLanguage(){doc.documentElement.lang=language;translate(doc.body);local.setItem('topleaks-language',language);langControl.value=language;settingsButton.setAttribute('aria-label',language==='fr'?'Paramètres':'Settings');settingsButton.title=language==='fr'?'Paramètres':'Settings';updateAuth()}
    function translate(root){var map=dict(language),walker=doc.createTreeWalker(root,win.NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(function(node){var original=node.nodeValue,trimmed=original.trim();if(map[trimmed])node.nodeValue=original.replace(trimmed,map[trimmed])});root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(function(el){['placeholder','aria-label','title'].forEach(function(attr){var val=el.getAttribute(attr);if(val&&map[val])el.setAttribute(attr,map[val])})})}
    function updateAuth(){var signed=!!(session&&session.access_token);userLine.textContent=signed?(language==='fr'?'Vous êtes connecté. ':'You are signed in. ')+(session.user&&session.user.email||''): (language==='fr'?'Vous n’êtes pas connecté.':'You are signed out.');form.hidden=signed;logout.hidden=!signed;doc.getElementById('tl-auth-title').textContent=signed?(language==='fr'?'Compte':'Account'):(language==='fr'?'Connexion':'Sign in');loginButton.textContent=language==='fr'?'Connexion':'Sign in';signupButton.textContent=language==='fr'?'Créer un compte':'Create account';doc.getElementById('tl-email').placeholder=language==='fr'?'Adresse e-mail':'Email address';doc.getElementById('tl-email').setAttribute('aria-label',doc.getElementById('tl-email').placeholder);doc.getElementById('tl-password').placeholder=language==='fr'?'Mot de passe':'Password';doc.getElementById('tl-password').setAttribute('aria-label',doc.getElementById('tl-password').placeholder);logout.textContent=language==='fr'?'Déconnexion':'Sign out'}
    function translateSettings(){doc.getElementById('tl-title').textContent=language==='fr'?'Paramètres':'Settings';doc.querySelector('.tl-close').setAttribute('aria-label',language==='fr'?'Fermer':'Close');doc.querySelector('.tl-row span').textContent=language==='fr'?'Langue':'Language';doc.querySelectorAll('.tl-row')[1].querySelector('span').textContent=language==='fr'?'Mode sombre':'Dark mode';doc.querySelector('#tl-language option[value="fr"]').textContent='Français';doc.querySelector('#tl-language option[value="en"]').textContent='English';updateAuth()}
    // Keep the Supabase connectivity/debug text out of the public interface.
    var status=doc.getElementById('status');if(status)status.classList.add('tl-status-hidden');
    var observer=new win.MutationObserver(function(records){records.forEach(function(record){if(record.type==='childList')record.addedNodes.forEach(function(node){if(node.nodeType===1)translate(node);else if(node.nodeType===3){var map=dict(language),t=node.nodeValue.trim();if(map[t])node.nodeValue=node.nodeValue.replace(t,map[t])}})});var statusEl=doc.getElementById('status');if(statusEl)statusEl.classList.add('tl-status-hidden')});observer.observe(doc.body,{childList:true,subtree:true});
    settingsButton.addEventListener('click',function(){translateSettings();backdrop.classList.add('open')});doc.querySelector('.tl-close').addEventListener('click',function(){backdrop.classList.remove('open')});backdrop.addEventListener('click',function(e){if(e.target===backdrop)backdrop.classList.remove('open')});
    langControl.addEventListener('change',function(){language=langControl.value;applyLanguage();translateSettings()});themeControl.addEventListener('change',function(){dark=themeControl.checked;applyTheme()});
    function authRequest(path,payload,successText){message.textContent='';var email=doc.getElementById('tl-email').value.trim(),password=doc.getElementById('tl-password').value;if(!email||!password){message.textContent=language==='fr'?'Saisis ton e-mail et ton mot de passe.':'Enter your email and password.';return}var endpoint=path==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';fetch(PROJECT+endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:email,password:password})}).then(function(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.msg||data.message||data.error_description||data.error||'Auth error');return data})}).then(function(data){if(data.access_token){session=data;local.setItem('topleaks-auth-session',JSON.stringify(data));message.textContent=successText;updateAuth()}else if(path==='signup'){message.textContent=language==='fr'?'Compte créé. Vérifie ton e-mail si une confirmation est demandée.':'Account created. Check your email if confirmation is required.'}else{throw new Error('No session returned')}}).catch(function(error){message.textContent=(language==='fr'?'Connexion impossible : ':'Could not sign in: ')+error.message})}
    form.addEventListener('submit',function(e){e.preventDefault();authRequest('login',null,language==='fr'?'Connexion réussie.':'Signed in successfully.')});signupButton.addEventListener('click',function(){authRequest('signup',null,language==='fr'?'Compte créé, connecté.':'Account created and signed in.')});logout.addEventListener('click',function(){var token=session&&session.access_token;if(token)fetch(PROJECT+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token}}).catch(function(){});local.removeItem('topleaks-auth-session');session=null;message.textContent=language==='fr'?'Déconnexion effectuée.':'Signed out.';updateAuth()});
    applyTheme();applyLanguage();translateSettings();
  }
  frame.addEventListener('load',function(){try{init()}catch(error){console.error('TOPLEAKS settings init failed',error)}});
})();
</script>
