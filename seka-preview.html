<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TOPLEAKS — aperçu ALL</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="app" title="Aperçu de TOPLEAKS, catalogue ALL" src="TOPLEAKS.html"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('app');
      function makePreview(){
        var doc;
        try{doc=frame.contentDocument||frame.contentWindow.document}catch(e){return}
        if(!doc)return;
        var rows=doc.querySelector('#rows');
        if(!rows)return;

        var seen={};
        var cards=[];
        rows.querySelectorAll('.card[data-open]').forEach(function(card){
          var id=card.getAttribute('data-open');
          if(id&&!seen[id]&&cards.length<12){seen[id]=true;cards.push(card)}
        });

        var hero=doc.querySelector('#hero');
        if(hero)hero.hidden=true;
        rows.innerHTML='';
        var section=doc.createElement('section');
        section.className='row';
        var heading=doc.createElement('h2');
        heading.textContent='ALL';
        var rail=doc.createElement('div');
        rail.className='rail preview-all';
        rail.tabIndex=0;
        rail.setAttribute('role','region');
        rail.setAttribute('aria-label','Toutes les vidéos, défilement horizontal. Utilisez les flèches gauche et droite.');
        cards.forEach(function(card){rail.appendChild(card)});
        section.appendChild(heading);
        section.appendChild(rail);
        rows.appendChild(section);

        var css=doc.createElement('style');
        css.textContent='.preview-all{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#ffb21e #2a2a31;padding:4px 2px 12px;cursor:grab;overscroll-behavior-inline:contain;touch-action:pan-x}.preview-all:active{cursor:grabbing}.preview-all:focus-visible{outline:2px solid #f2f0eb;outline-offset:4px;border-radius:8px}.preview-all .card{flex:0 0 calc((100% - 30px)/4);min-width:0;scroll-snap-align:start;padding:5px 5px 8px;border-radius:12px}.preview-all .thumb{aspect-ratio:16/10;border-radius:9px}.preview-all .glyph{font-size:54px}.preview-all .vip{font-size:9px;padding:2px 4px}.preview-all .c-title{font-size:12px;line-height:1.25}.preview-all .c-meta{font-size:10px;overflow-wrap:anywhere}@media(max-width:360px){.preview-all .card{flex-basis:calc((100% - 20px)/3)}}';
        doc.head.appendChild(css);

        rail.addEventListener('keydown',function(e){
          var step=Math.max(160,Math.round(rail.clientWidth*.75));
          if(e.key==='ArrowRight'||e.key==='PageDown'){rail.scrollBy({left:step,behavior:'smooth'});e.preventDefault()}
          else if(e.key==='ArrowLeft'||e.key==='PageUp'){rail.scrollBy({left:-step,behavior:'smooth'});e.preventDefault()}
          else if(e.key==='Home'){rail.scrollTo({left:0,behavior:'smooth'});e.preventDefault()}
          else if(e.key==='End'){rail.scrollTo({left:rail.scrollWidth,behavior:'smooth'});e.preventDefault()}
        });
        rail.addEventListener('wheel',function(e){
          if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){rail.scrollLeft+=e.deltaY;e.preventDefault()}
        },{passive:false});
        var down=false,startX=0,startLeft=0,dragged=false;
        rail.addEventListener('pointerdown',function(e){
          if(e.pointerType==='touch'||e.button!==0)return;
          down=true;dragged=false;startX=e.clientX;startLeft=rail.scrollLeft;
          try{rail.setPointerCapture(e.pointerId)}catch(_){}
        });
        rail.addEventListener('pointermove',function(e){
          if(!down)return;
          var dx=e.clientX-startX;
          if(Math.abs(dx)>5)dragged=true;
          if(dragged){rail.scrollLeft=startLeft-dx;e.preventDefault()}
        });
        function stopDrag(){if(down){down=false;if(dragged){rail.dataset.dragged='yes';setTimeout(function(){delete rail.dataset.dragged},180)}}}
        rail.addEventListener('pointerup',stopDrag);
        rail.addEventListener('pointercancel',stopDrag);
        rail.addEventListener('click',function(e){if(rail.dataset.dragged==='yes'){e.preventDefault();e.stopPropagation()}},true);
      }
      frame.addEventListener('load',makePreview);
    })();
  </script>
</body>
</html>
