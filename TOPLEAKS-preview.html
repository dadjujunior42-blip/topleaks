<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TOPLEAKS — aperçu avec défilement accessible</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="app" title="Aperçu de l’application TOPLEAKS" src="TOPLEAKS.html"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('app');
      function enableAccessibleRails(){
        var doc;
        try{doc=frame.contentDocument||frame.contentWindow.document}catch(e){return}
        if(!doc||!doc.querySelectorAll)return;
        var style=doc.createElement('style');
        style.textContent='.rail{cursor:grab;scroll-behavior:smooth;overscroll-behavior-inline:contain}.rail:active{cursor:grabbing}.rail:focus-visible{outline:2px solid #f2f0eb;outline-offset:4px;border-radius:8px}.rail .card{user-select:none;-webkit-user-drag:none}';
        doc.head.appendChild(style);
        var rails=doc.querySelectorAll('.rail');
        Array.prototype.forEach.call(rails,function(rail,index){
          var heading=rail.parentElement&&rail.parentElement.querySelector('h2');
          rail.tabIndex=0;
          rail.setAttribute('role','region');
          rail.setAttribute('aria-label',(heading?heading.textContent:'Vidéos')+' — défilement horizontal');
          rail.addEventListener('keydown',function(event){
            if(event.altKey||event.ctrlKey||event.metaKey)return;
            var step=Math.max(200,Math.round(rail.clientWidth*.75));
            if(event.key==='ArrowRight'){rail.scrollBy({left:step,behavior:'smooth'});event.preventDefault()}
            else if(event.key==='ArrowLeft'){rail.scrollBy({left:-step,behavior:'smooth'});event.preventDefault()}
            else if(event.key==='PageDown'){rail.scrollBy({left:step,behavior:'smooth'});event.preventDefault()}
            else if(event.key==='PageUp'){rail.scrollBy({left:-step,behavior:'smooth'});event.preventDefault()}
            else if(event.key==='Home'){rail.scrollTo({left:0,behavior:'smooth'});event.preventDefault()}
            else if(event.key==='End'){rail.scrollTo({left:rail.scrollWidth,behavior:'smooth'});event.preventDefault()}
          });
          rail.addEventListener('wheel',function(event){
            if(Math.abs(event.deltaY)>Math.abs(event.deltaX)&&rail.scrollWidth>rail.clientWidth){
              rail.scrollLeft+=event.deltaY;
              event.preventDefault();
            }
          },{passive:false});
          var startX=0,startScroll=0,dragging=false,moved=false;
          rail.addEventListener('pointerdown',function(event){
            if(event.pointerType==='touch'||event.button!==0)return;
            startX=event.clientX;startScroll=rail.scrollLeft;dragging=true;moved=false;
            try{rail.setPointerCapture(event.pointerId)}catch(e){}
          });
          rail.addEventListener('pointermove',function(event){
            if(!dragging)return;
            var delta=event.clientX-startX;
            if(Math.abs(delta)>5)moved=true;
            if(moved){rail.scrollLeft=startScroll-delta;event.preventDefault()}
          });
          function endDrag(){
            if(!dragging)return;
            dragging=false;
            if(moved){
              var cards=rail.querySelectorAll('.card');
              Array.prototype.forEach.call(cards,function(card){card.dataset.dragIgnore='true'});
              setTimeout(function(){Array.prototype.forEach.call(cards,function(card){delete card.dataset.dragIgnore})},150);
            }
          }
          rail.addEventListener('pointerup',endDrag);
          rail.addEventListener('pointercancel',endDrag);
          rail.addEventListener('click',function(event){
            if(event.target.closest('[data-drag-ignore]')){event.preventDefault();event.stopPropagation()}
          },true);
        });
      }
      frame.addEventListener('load',enableAccessibleRails);
    })();
  </script>
</body>
</html>
