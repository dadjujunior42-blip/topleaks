<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TOPLEAKS — aperçu ALL</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="app" title="Aperçu de l’application TOPLEAKS" src="TOPLEAKS.html"></iframe>
  <script>
    (function(){
      var frame=document.getElementById('app');
      function customizeCatalog(){
        var doc;
        try{doc=frame.contentDocument||frame.contentWindow.document}catch(e){return}
        if(!doc||!doc.querySelectorAll)return;

        /* Une seule section ALL, avec 12 vignettes uniques. */
        var home=doc.querySelector('#home');
        var rows=doc.querySelector('#rows');
        if(!home||!rows)return;
        var cards=rows.querySelectorAll('.card[data-open]');
        var seen={};
        var unique=[];
        Array.prototype.forEach.call(cards,function(card){
          var id=card.getAttribute('data-open');
          if(id&&!seen[id]&&unique.length<12){seen[id]=true;unique.push(card)}
        });

        var hero=doc.querySelector('#hero');
        if(hero)hero.hidden=true;
        rows.innerHTML='';
        var section=doc.createElement('section');
        section.className='row';
        var title=doc.createElement('h2');
        title.textContent='ALL';
        var rail=doc.createElement('div');
        rail.className='rail';
        rail.tabIndex=0;
        rail.setAttribute('role','region');
        rail.setAttribute('aria-label','Toutes les vidéos — défilement horizontal');
        unique.forEach(function(card){rail.appendChild(card)});
        section.appendChild(title);
        section.appendChild(rail);
        rows.appendChild(section);

        var style=doc.createElement('style');
        style.textContent=
          '.rail{gap:10px;cursor:grab;scroll-behavior:smooth;overscroll-behavior-inline:contain;touch-action:pan-x}' +
          '.rail:active{cursor:grabbing}' +
          '.rail:focus-visible{outline:2px solid #f2f0eb;outline-offset:4px;border-radius:8px}' +
          '.rail .card{flex:0 0 calc((min(100vw,520px) - 64px)/4);user-select:none;-webkit-user-drag:none}' +
          '.rail .thumb{aspect-ratio:16/10}' +
          '@media(max-width:360px){.rail .card{flex-basis:calc((100vw - 58px)/3)}}';
        doc.head.appendChild(style);

        rail.addEventListener('keydown',function(event){
          if(event.altKey||event.ctrlKey||event.metaKey)return;
          var step=Math.max(160,Math.round(rail.clientWidth*.75));
          if(event.key==='ArrowRight'||event.key==='PageDown'){rail.scrollBy({left:step,behavior:'smooth'});event.preventDefault()}
          else if(event.key==='ArrowLeft'||event.key==='PageUp'){rail.scrollBy({left:-step,behavior:'smooth'});event.preventDefault()}
          else if(event.key==='Home'){rail.scrollTo({left:0,behavior:'smooth'});event.preventDefault()}
          else if(event.key==='End'){rail.scrollTo({left:rail.scrollWidth,behavior:'smooth'});event.preventDefault()}
        });
        rail.addEventListener('wheel',function(event){
          if(Math.abs(event.deltaY)>Math.abs(event.deltaX)&&rail.scrollWidth>rail.clientWidth){
            rail.scrollLeft+=event.deltaY;
            event.preventDefault();
          }
        },{passive:false});

        var startX=0,startScroll=0,dragging=false,moved=false;
        rail.addEventListener('pointerdown',function(event){
          if(event.pointerType==='touch'||event.button!==0)return;
          startX=event.clientX;startScroll=rail.scrollLeft;dragging=true;moved=false;
          try{rail.setPointerCapture(event.pointerId)}catch(e){}
        });
        rail.addEventListener('pointermove',function(event){
          if(!dragging)return;
          var delta=event.clientX-startX;
          if(Math.abs(delta)>5)moved=true;
          if(moved){rail.scrollLeft=startScroll-delta;event.preventDefault()}
        });
        function endDrag(){
          if(!dragging)return;
          dragging=false;
          if(moved){
            rail.dataset.dragIgnore='true';
            setTimeout(function(){delete rail.dataset.dragIgnore},150);
          }
        }
        rail.addEventListener('pointerup',endDrag);
        rail.addEventListener('pointercancel',endDrag);
        rail.addEventListener('click',function(event){
          if(rail.dataset.dragIgnore==='true'){event.preventDefault();event.stopPropagation()}
        },true);
      }
      frame.addEventListener('load',customizeCatalog);
    })();
  </script>
</body>
</html>
